# The whole demo in one command: `docker compose up --build` (or `pnpm demo`), then open http://localhost:5174.
#
#   keys       generates the demo bank's RS256 key pair, session secret and ops token into a shared volume
#   postgres   the platform database (in memory: restarting the stack resets the demo)
#   mock-core  mock core banking: customer accounts, holds, FX postings, dekont, reference rates
#   api        the P2P platform API: matching, settlement, the bank's ladder (BANK_MM) and its bot (BOT_MM), which
#              keep the board from looking empty with real bank orders (bots never trade with each other)
#   web        the embeddable customer UI (http://localhost:5173)
#   demo-host  the fake bank app with two phones side by side (http://localhost:5174)
#
# Scripted end-to-end trade, narrated in Turkish: `docker compose run --rm walkthrough`.
#
# DEMO ONLY. Ports are published on 127.0.0.1: the demo bank app mints launch tokens for any customer and
# mock-core has no authentication, so this stack must never be reachable from a network. Production
# deployments ship the api (and the built web app) only, with the bank's own core, LP gateway and secrets.
# One image for every Node service. Only `keys` builds it: when several services share an image name and
# each has a build section, Compose builds them in parallel and the exports collide ("image already exists").
x-node: &node
  image: p2pfx-demo
  pull_policy: never
  volumes: ["keys:/keys"]

services:
  keys:
    <<: *node
    build: .
    command: ["node", "--import", "tsx", "scripts/dev-keys.ts", "--out", "/keys/.env"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2pfx
    # In memory, like the mock core, so a restart starts both from the same clean demo state.
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  mock-core:
    <<: *node
    command: ["node", "--import", "tsx", "apps/mock-core/src/main.ts"]
    # Needs no secrets.
    volumes: []
    environment:
      PORT: "4100"
      SEED_DEMO: "1"
    ports: ["127.0.0.1:4100:4100"]

  api:
    <<: *node
    command: ["node", "--env-file=/keys/.env", "--import", "tsx", "apps/api/src/main.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/p2pfx
      CORE_BANKING_URL: http://mock-core:4100
      PORT: "4000"
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30
    depends_on:
      keys: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mock-core: { condition: service_started }

  web:
    <<: *node
    working_dir: /app/apps/web
    command: ["node", "node_modules/vite/bin/vite.js"]
    volumes: []
    environment:
      API_URL: http://api:4000
      # Only the demo bank app may embed the marketplace; opened directly in a browser it refuses to start.
      VITE_HOST_ORIGINS: http://localhost:5174
      FRAME_ANCESTORS: http://localhost:5174
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }

  demo-host:
    <<: *node
    working_dir: /app/apps/demo-host
    # The browser loads the web app from the host machine, hence localhost.
    command: ["node", "--env-file=/keys/.env", "node_modules/vite/bin/vite.js"]
    # /dealer.html is the bank's FX desk; it calls the API's /ops endpoints server-side with OPS_TOKEN.
    environment:
      WEB_APP_URL: http://localhost:5173
      API_URL: http://api:4000
    ports: ["127.0.0.1:5174:5174"]
    depends_on:
      keys: { condition: service_completed_successfully }
      web: { condition: service_started }
      api: { condition: service_healthy }

  walkthrough:
    <<: *node
    profiles: ["tools"]
    command: ["node", "--env-file=/keys/.env", "--import", "tsx", "scripts/demo-walkthrough.ts"]
    environment:
      API_URL: http://api:4000
      CORE_BANKING_URL: http://mock-core:4100
    depends_on:
      api: { condition: service_healthy }

volumes:
  keys:
