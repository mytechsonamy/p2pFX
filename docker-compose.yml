# The whole demo in one command: `docker compose up --build` (or `pnpm demo`), then open http://localhost:5174.
#
#   keys       generates the demo bank's RS256 key pair, session secret and ops token into a shared volume
#   postgres   the platform database (in memory: restarting the stack resets the demo)
#   mock-core  mock core banking: customer accounts, holds, FX postings, dekont, reference rates
#   api        the P2P platform API, matching and settlement
#   seed       one-off: fills the board with a trade history and resting orders, then exits
#   web        the embeddable customer UI (http://localhost:5173)
#   demo-host  the fake bank app with two phones side by side (http://localhost:5174)
#
# Scripted end-to-end trade, narrated in Turkish: `docker compose run --rm walkthrough`.
x-node: &node
  build: .
  image: p2pfx-demo
  volumes: ["keys:/keys"]

services:
  keys:
    <<: *node
    command: ["node", "--import", "tsx", "scripts/dev-keys.ts", "--out", "/keys/.env"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2pfx
    # In memory, like the mock core, so a restart starts both from the same clean demo state.
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  mock-core:
    <<: *node
    command: ["node", "--import", "tsx", "apps/mock-core/src/main.ts"]
    environment:
      PORT: "4100"
      SEED_DEMO: "1"
    ports: ["4100:4100"]

  api:
    <<: *node
    command: ["node", "--env-file=/keys/.env", "--import", "tsx", "apps/api/src/main.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/p2pfx
      CORE_BANKING_URL: http://mock-core:4100
      PORT: "4000"
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30
    depends_on:
      keys: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mock-core: { condition: service_started }

  seed:
    <<: *node
    command: ["node", "--env-file=/keys/.env", "--import", "tsx", "scripts/seed-market.ts"]
    environment: &clients
      API_URL: http://api:4000
      CORE_BANKING_URL: http://mock-core:4100
    depends_on:
      api: { condition: service_healthy }

  web:
    <<: *node
    working_dir: /app/apps/web
    command: ["node", "node_modules/vite/bin/vite.js"]
    environment:
      API_URL: http://api:4000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }

  demo-host:
    <<: *node
    working_dir: /app/apps/demo-host
    # The browser loads the web app from the host machine, hence localhost.
    command: ["node", "--env-file=/keys/.env", "node_modules/vite/bin/vite.js"]
    environment:
      WEB_APP_URL: http://localhost:5173
    ports: ["5174:5174"]
    depends_on:
      keys: { condition: service_completed_successfully }
      web: { condition: service_started }

  walkthrough:
    <<: *node
    profiles: ["tools"]
    command: ["node", "--env-file=/keys/.env", "--import", "tsx", "scripts/demo-walkthrough.ts"]
    environment: *clients
    depends_on:
      api: { condition: service_healthy }

volumes:
  keys:
