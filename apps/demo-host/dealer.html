<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banka FX masası</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/host.css" />
  </head>
  <body class="dealer">
    <header class="toolbar">
      <div>
        <h1>Banka FX masası</h1>
        <p>LP fiyatları, segment bazlı banka kurları, pozisyonlar ve hedge işlemleri. Saniyede bir yenilenir.</p>
      </div>
      <div class="toolbar-actions">
        <a class="dealer-link" href="/backoffice.html">Backoffice parametreleri</a>
        <span id="status" class="status-dot">bağlanıyor…</span>
      </div>
    </header>
    <section id="policy" class="desk-card policy" hidden>
      <h2>Otomatik hedge kuralı <small>Banka parametresi, kaydedince anında geçerli</small></h2>
      <form id="policy-form">
        <label><input type="checkbox" name="autoHedge" /> Otomatik hedge açık</label>
        <label>Hedef seviye <input name="targetPct" type="number" min="0" max="99" step="1" /> % (limitin; 0 = sıfırla)</label>
        <label>Dağıtım
          <select name="split">
            <option value="ACROSS_LPS">Parçaları LP'lere sırayla dağıt</option>
            <option value="BEST_LP">Hepsi en iyi fiyatlı LP'ye</option>
          </select>
        </label>
        <div class="per-ccy" id="per-ccy"></div>
        <label>Gerekçe <input name="reason" required minlength="3" placeholder="denetim izine yazılır" /></label>
        <button type="submit">Kaydet</button>
        <span id="policy-msg" class="muted"></span>
      </form>
    </section>
    <main id="dealer"></main>
    <script type="module" src="/src/dealer.ts"></script>
  </body>
</html>
